name: Build Android APK and AAB - HisabPro

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android Binaries
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Dependencies
        run: npm ci

      - name: Build Web Production Assets
        run: npm run build

      - name: Sync Capacitor Android Project
        run: npx cap sync android

      - name: Make Gradle Wrapper Executable
        run: chmod +x android/gradlew

      - name: Build Debug APK (For Testing & Sideloading)
        run: |
          cd android
          ./gradlew assembleDebug

      - name: Build Android App Bundle (AAB for Google Play)
        run: |
          cd android
          ./gradlew bundleRelease

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: HisabPro-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      - name: Upload Google Play Release Bundle (AAB)
        uses: actions/upload-artifact@v4
        with:
          name: HisabPro-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30
